# Checks that run before every commit and again in CI. Install with scripts/setup-dev-tools.sh.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: private-name-guard
        name: private-name guard (hostnames, IPs, MACs)
        entry: python3 scripts/private_name_guard.py
        language: system
        pass_filenames: false
        always_run: true
