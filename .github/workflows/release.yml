name: release
# A version tag (for example 0.1.0) runs every check, then builds the image once and pushes it to the
# container registry under that exact version, and moves the `stable` tag to it so that Unraid's "check for
# updates" and "update" (and Compose Manager) can follow releases. There is no `latest` tag, by design.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag, program version, and changelog agree
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' brief/src/brief/__init__.py)
          [ "$tag" = "$version" ] || { echo "tag $tag does not match __version__ $version" >&2; exit 1; }
          grep -q "^## ${tag}\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## ${tag}' entry" >&2; exit 1; }
  checks:
    needs: verify-tag
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the upgrade check looks up the previous release tag
      - name: Build the runtime image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${owner}/homelab-brief" >> "$GITHUB_ENV"
          docker build --target runtime \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "homelab-brief:${GITHUB_REF_NAME}" .
      - name: Upgrade check from the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          previous=$(printf '%s\n' $(git tag -l '[0-9]*.[0-9]*.[0-9]*') "$GITHUB_REF_NAME" \
            | sort -Vu | grep -x -B1 "$GITHUB_REF_NAME" | head -1)
          [ "$previous" = "$GITHUB_REF_NAME" ] && previous=""
          if [ -n "$previous" ] && docker pull "${IMAGE}:${previous}"; then
            python3 scripts/e2e_upgrade.py --old "${IMAGE}:${previous}" --new "homelab-brief:${GITHUB_REF_NAME}"
          else
            echo "no published previous release to upgrade from; skipping"
          fi
      - name: Push (the version tag, and the moving stable tag; never latest)
        run: |
          docker tag "homelab-brief:${GITHUB_REF_NAME}" "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker tag "homelab-brief:${GITHUB_REF_NAME}" "${IMAGE}:stable"
          docker push "${IMAGE}:stable"
          echo "Published ${IMAGE}:${GITHUB_REF_NAME} (and moved :stable to it)" >> "$GITHUB_STEP_SUMMARY"
