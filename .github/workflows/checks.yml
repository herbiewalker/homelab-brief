name: checks
on:
  push:
    branches: ["**"]  # a version tag runs release.yml, which calls this workflow first
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  lint-and-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-tools.txt
      - run: pre-commit run --all-files
      - run: python3 scripts/private_name_guard.py --all
      - run: pytest scripts/tests -q
      - name: Secrets scan over full history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
  image-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target test -t homelab-brief:test .
      - run: docker run --rm homelab-brief:test
      - run: docker build --target runtime -t homelab-brief:ci .
      - run: sh scripts/test-vector.sh homelab-brief:ci
      - run: python3 scripts/e2e_vector.py --image homelab-brief:ci
      - run: python3 scripts/e2e_web.py --image homelab-brief:ci
      - run: python3 scripts/e2e_mqtt.py --image homelab-brief:ci
      - run: python3 scripts/e2e_collector.py --image homelab-brief:ci
      - run: python3 scripts/e2e_devices.py --image homelab-brief:ci
      - run: python3 scripts/e2e_ai.py --image homelab-brief:ci
