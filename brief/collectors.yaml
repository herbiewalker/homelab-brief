# Phase 2 collectors. Everything starts disabled. Enable one at a time, in any order,
# here or on the admin GUI's Collectors page (which also offers "Test connection").
# Credentials come from template variables (see secrets.env.example), never from this file.
schema: 1
collectors:
  unraid:
    enabled: false
    interval: hourly
    timeout_s: 90               # for all servers together; each request also stops after request_timeout_s
    request_timeout_s: 10
    # One entry per Unraid server. id: lowercase letters, digits and hyphens (it names the sensors).
    # key_var names the template variable holding that server's read-only API key. A server with a
    # self-signed certificate (the usual case on a LAN address) needs verify_tls: false.
    servers:
      - { id: server-1, url: "https://<server-1-ip>/graphql", key_var: UNRAID_SERVER_1_API_KEY, verify_tls: false }
      - { id: server-2, url: "https://<server-2-ip>/graphql", key_var: UNRAID_SERVER_2_API_KEY, verify_tls: false }
      - { id: server-3, url: "https://<model-server-ip>/graphql", key_var: UNRAID_SERVER_3_API_KEY, verify_tls: false }
    # api: the overall SMART verdict and the temperature, which the Unraid API reports; it has no attribute table.
    # smartctl_files: also read the attributes (reallocated, pending, CRC errors) from smartctl JSON files that a
    # User Script on each server writes (deploy/unraid-smart-export.sh). Mount that share at smart_files_path;
    # each server writes into a folder named after its id.
    smart_source: api           # api | smartctl_files
    smart_files_path: /import-smart

  unifi:
    enabled: false
    interval: hourly
    # Devices, firmware, and uplinks from the UniFi Network Integration API (create a read-only API key in
    # the Network application). url_var holds the console address, for example https://<console-ip>;
    # key_var holds the key. A console on a LAN address usually has a self-signed certificate: verify_tls: false.
    url_var: UNIFI_URL
    key_var: UNIFI_API_KEY
    verify_tls: true
    # Client data (Task 21) is off until you turn it on, and every device is limited by its profile in
    # devices.yaml (full | security_only | ignore; a device not listed is security_only). Quiet hours there are UTC.
    clients: false             # who is connected now (hourly): client rows, and presence for `full` devices
    traffic: false             # hourly traffic per device, from the older stat/sta endpoint (needs clients: true)
    client_logs: false         # gateway DNS and access point join/leave lines from syslog (see docs/guide/06)
    # traffic_path: /proxy/network/api/s/{site}/stat/sta
    # site: Default            # a site name; leave out for every site
    # api_path: /proxy/network/integration   # a UniFi OS console; a self-hosted application uses /integration
    # Firmware is also read from the syslog headers of switches, access points, and PDUs on every pass,
    # so inventory has it even when the API is not reachable or no key is set.

  snmp:
    enabled: false
    interval: hourly
    version: v3                 # v3 preferred; v2c allowed on the LAN
    # SNMPv3: the user, and the authentication key (and the encryption key for authPriv), come from template
    # variables. v2c: community_var names the variable holding the community string instead.
    user_var: SNMP_V3_USER
    auth_key_var: SNMP_V3_AUTH_KEY
    priv_key_var: SNMP_V3_PRIV_KEY
    auth_protocol: SHA          # MD5 | SHA | SHA-224 | SHA-256 | SHA-384 | SHA-512
    priv_protocol: AES          # DES | AES | AES-192 | AES-256
    # community_var: SNMP_COMMUNITY
    # One entry per device. profile: switch (uptime, ports, interface errors), ups (RFC 1628 UPS-MIB), or
    # custom (the OIDs you list, for a PDU or anything else).
    targets: []
    #  - { id: switch-1, host: "<switch-ip>", profile: switch }
    #  - { id: ups-1, host: "<ups-ip>", profile: ups }
    #  - id: pdu-1
    #    host: "<pdu-ip>"
    #    profile: custom
    #    oids:
    #      - { name: outlet_1_power_w, oid: "1.3.6.1.4.1.<vendor>.<oid>", scale: 0.1, unit: W }

  idrac:
    enabled: false
    interval: hourly
    # ipmi: IPMI-over-LAN with ipmitool; the only thing an older iDRAC (7, in 12th-generation PowerEdge servers)
    # supports. Enable IPMI over LAN in the iDRAC and use a read-only (USER) account.
    # redfish: HTTPS and JSON for iDRAC 8 and 9 (verify_tls: false for the usual self-signed certificate).
    protocol: redfish           # redfish | ipmi
    # privilege: USER          # ipmi: the privilege level to ask for
    # cipher_suite: 3          # ipmi: set only if the default is refused
    # verify_tls: true         # redfish
    host_var: IDRAC_HOST
    user_var: IDRAC_USER
    password_var: IDRAC_PASSWORD

  ha_statestream:
    enabled: false
    # Power and energy that Home Assistant already knows, read from the same MQTT broker as the publisher
    # (MQTT_HOST, MQTT_PORT, MQTT_USER, MQTT_PASSWORD; no Home Assistant token). In Home Assistant enable
    # mqtt_statestream with this base topic and include just the entities listed here.
    base_topic: "homelab/ha"    # must match mqtt_statestream base_topic in Home Assistant
    window_s: 5                 # how long each hourly run listens (retained states arrive at once)
    # kind: power (instantaneous watts, the default) or energy (a cumulative kWh meter).
    # system: the id of a system in systems.yaml (or any lowercase name); power and energy add up per system.
    # scale: 1000 turns kW into W, 0.001 turns Wh into kWh.
    entities: []
    #  - { entity: sensor.server_2_power, system: server-2, kind: power }
    #  - { entity: sensor.server_2_energy, system: server-2, kind: energy }
    #  - { entity: sensor.ups_load_kw, system: rack, kind: power, scale: 1000 }

  dns_filter:
    enabled: false              # only if the gateway's coredns logs are not enough
    interval: hourly
    source: adguard_home        # adguard_home | pihole
    url_var: DNS_FILTER_URL
    token_var: DNS_FILTER_TOKEN
