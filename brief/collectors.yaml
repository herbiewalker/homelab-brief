# Phase 2 collectors. Everything starts disabled. Enable one at a time, in any order,
# here or on the admin GUI's Collectors page (which also offers "Test connection").
# Credentials come from template variables (see secrets.env.example), never from this file.
schema: 1
collectors:
  unraid:
    enabled: false
    interval: hourly
    timeout_s: 90               # for all servers together; each request also stops after request_timeout_s
    request_timeout_s: 10
    # One entry per Unraid server. id: lowercase letters, digits and hyphens (it names the sensors).
    # key_var names the template variable holding that server's read-only API key. A server with a
    # self-signed certificate (the usual case on a LAN address) needs verify_tls: false.
    servers:
      - { id: server-1, url: "https://<server-1-ip>/graphql", key_var: UNRAID_SERVER_1_API_KEY, verify_tls: false }
      - { id: server-2, url: "https://<server-2-ip>/graphql", key_var: UNRAID_SERVER_2_API_KEY, verify_tls: false }
      - { id: server-3, url: "https://<model-server-ip>/graphql", key_var: UNRAID_SERVER_3_API_KEY, verify_tls: false }
    # api: the overall SMART verdict and the temperature, which the Unraid API reports; it has no attribute table.
    # smartctl_files: also read the attributes (reallocated, pending, CRC errors) from smartctl JSON files that a
    # User Script on each server writes (deploy/unraid-smart-export.sh). Mount that share at smart_files_path;
    # each server writes into a folder named after its id.
    smart_source: api           # api | smartctl_files
    smart_files_path: /import-smart

  unifi:
    enabled: false
    interval: hourly
    # Devices, firmware, and uplinks from the UniFi Network Integration API (create a read-only API key in
    # the Network application). url_var holds the console address, for example https://<console-ip>;
    # key_var holds the key. A console on a LAN address usually has a self-signed certificate: verify_tls: false.
    url_var: UNIFI_URL
    key_var: UNIFI_API_KEY
    verify_tls: true
    # site: Default            # a site name; leave out for every site
    # api_path: /proxy/network/integration   # a UniFi OS console; a self-hosted application uses /integration
    # Firmware is also read from the syslog headers of switches, access points, and PDUs on every pass,
    # so inventory has it even when the API is not reachable or no key is set.

  snmp:
    enabled: false
    interval: hourly
    version: v3                 # v3 preferred; v2c allowed on the LAN
    targets: []                 # for example { host: "<switch-ip>", profile: switch }

  idrac:
    enabled: false
    interval: hourly
    protocol: redfish           # redfish | ipmi (whichever the iDRAC firmware supports)
    host_var: IDRAC_HOST
    user_var: IDRAC_USER
    password_var: IDRAC_PASSWORD

  ha_statestream:
    enabled: false
    base_topic: "homelab/ha"    # must match mqtt_statestream base_topic in Home Assistant
    entities: []                # for example { entity: sensor.server_2_power, system: server-2 }

  dns_filter:
    enabled: false              # only if the gateway's coredns logs are not enough
    interval: hourly
    source: adguard_home        # adguard_home | pihole
    url_var: DNS_FILTER_URL
    token_var: DNS_FILTER_TOKEN
