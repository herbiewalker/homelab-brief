# Optional notifications outside Home Assistant, through Apprise (ntfy, Gotify, email, and
# many others). Off by default. URLs contain credentials, so they come from template
# variables, never from this file. Routing still follows priorities.yaml and the alert
# lifecycle; this file only adds delivery channels.
schema: 1
apprise:
  enabled: false
  urls_var: APPRISE_URLS        # comma-separated Apprise URLs in the template variable
  routes: [push_now]            # which routes also go to Apprise: push_now, daily_headline
  include_resolved: true
mqtt:
  enabled: true                 # Home Assistant via MQTT stays the primary channel
