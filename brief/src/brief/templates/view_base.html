<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<title>{% block title %}Homelab brief{% endblock %}</title>
<style>
/* The tablet and e-reader views: one self-contained file, no script, no request out. Same palette as the console. */
:root { color-scheme: dark; --bg: #0a0d12; --surface: #10141b; --line: #1f2630; --fg: #e6eaf0; --muted: #a0abba; --ok: #36c47f; --warn: #f0b04a; --bad: #ff6b6b; --off: #6b7788; }
* { box-sizing: border-box; }
body { margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width: 64rem; margin: 0 auto; }
h1 { font-size: 1.3em; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 0.78em; margin: 22px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 650; }
.meta { color: var(--muted); font-size: 0.85em; font-variant-numeric: tabular-nums; }
.headline { font-size: 1.35em; font-weight: 650; margin: 12px 0; padding: 16px 18px; border: 1px solid var(--line); border-left: 6px solid var(--ok); border-radius: 8px; background: var(--surface); }
.headline.yellow { border-left-color: var(--warn); }
.headline.red, .headline.failed { border-left-color: var(--bad); }
.headline.unknown { border-left-color: var(--off); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 8px 0; }
.tile { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--ok); border-radius: 8px; color: var(--ok); font-weight: 650; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.05em; }
.tile.yellow { border-left-color: var(--warn); color: var(--warn); }
.tile.red { border-left-color: var(--bad); color: var(--bad); }
.tile.unknown { border-left-color: var(--off); color: var(--muted); }
.tile b { display: block; color: var(--fg); font-size: 1.2em; text-transform: none; letter-spacing: 0; margin-bottom: 2px; }
.story { margin: 8px 0; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--off); border-radius: 8px; }
.story.push_now { border-left-color: var(--bad); }
.story small { color: var(--muted); display: block; }
.prose { background: var(--surface); padding: 6px 16px 12px; border: 1px solid var(--line); border-radius: 8px; }
.note { color: var(--muted); font-size: 0.85em; }
ul { margin: 4px 0; padding-left: 22px; }
li { margin: 2px 0; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
