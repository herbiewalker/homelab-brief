<tr>
  <td class="col-check" data-label=""><input type="checkbox" data-bulk-item form="bulk-alerts" name="finding_id" value="{{ a.id }}" aria-label="Select {{ a.title }}"></td>
  <td data-label="Alert"><div class="cell-clip"><strong>{{ a.title }}</strong><div class="muted">{{ a.kind }}</div></div></td>
  <td data-label="State"><span class="badge {{ 'bad' if a.state == 'open' else 'ok' }}">{{ a.state }}</span>{% if a.snooze_until %}<div class="muted">until {{ a.snooze_until }}</div>{% endif %}</td>
  <td data-label="Level">{{ a.level }}</td>
  <td data-label="Opened" title="{{ a.opened }}">{{ a.opened_text }}</td>
  <td data-label="Notified" class="num">{{ a.pushed }}</td>
  <td data-label="">
    <div class="row-actions">
      {% for action, label in (('ack', 'Acknowledge'), ('snooze_24h', 'Snooze 24 h'), ('snooze_7d', 'Snooze 7 d')) %}
      <button type="button" class="btn btn--secondary btn--sm" hx-post="/admin/alerts/act" hx-vals='{"finding_id": "{{ a.id|e }}", "action": "{{ action }}"}' hx-target="closest tr" hx-swap="outerHTML">{{ label }}</button>
      {% endfor %}
    </div>
  </td>
</tr>
