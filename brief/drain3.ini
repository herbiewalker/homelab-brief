; Starting values. Tune after a week of real data.
[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 2000

[MASKING]
masking = [
    {"regex_pattern": "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b", "mask_with": "IP"},
    {"regex_pattern": "\\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\\b", "mask_with": "MAC"},
    {"regex_pattern": "\\b\\d+\\b", "mask_with": "NUM"}
  ]
