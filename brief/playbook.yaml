# Findings become recommendations through plain templating; no model needed.
# Conditions are structured (field, op, value). Nothing in this file is executed as code.
# Operators: eq, ne, gt, gte, lt, lte, in, contains, regex
# Thresholds and wording are starting values to tune against real data.
# bucket: watch (recheck in a week) | plan (replace within roughly 4-8 weeks) | act_now
# Disk guidance is rule-based, not a predicted failure date: SMART is a useful warning
# but a weak predictor.
schema: 1

thresholds:
  learning: { days: 7 }        # live days of baseline collection before novelty and deviation findings
  # returned = back after quiet_days_before_return of nothing, and only if its host logged other things
  # (at least host_active_hours_in_gap hours) meanwhile; if the host itself was down, the host returned
  # and only if it used to be regular (seen on at least min_prior_days days before it went quiet)
  novelty: { quiet_days_before_return: 7, host_active_hours_in_gap: 3, min_prior_days: 5 }
  # the baseline counts only windows in which the host logged anything; flag above median + mad_multiple x MAD
  # AND at least min_ratio x the median (when the median is not zero)
  deviation: { window_days: 14, min_count: 20, mad_multiple: 4, min_ratio: 3, min_history_days: 3 }
  # only for signatures with a pattern: enough history and concentrated in at most max_usual_hours hours of the day
  off_hours: { window_days: 14, min_count: 3, min_history_days: 3, min_history_events: 10, max_usual_hours: 8 }
  absence: { gap_multiple: 3, min_minutes: 30, max_hours: 24 }
  # a collector metric whose recent mean is far from its own earlier mean; silent until both windows hold min_samples
  metric_drift: { recent_days: 7, baseline_days: 21, min_change_pct: 20, min_samples: 24 }
  # a client's last 24 hours against its own median day: more than multiple times it and more than floor_gb;
  # needs min_history_days of its own history (client data exists only for devices whose devices.yaml profile allows it)
  traffic_spike: { multiple: 5, floor_gb: 2, window_days: 14, min_history_days: 3 }
  odd_hours: { min_online_min: 30 }      # a `full` device online this many minutes in an hour of its quiet_hours (UTC)
  # a client first seen more than settle_hours after the first one (the first pass is the starting population),
  # not listed in devices.yaml, is reported for show_days
  new_device: { settle_hours: 24, show_days: 3 }
  disk_temp_hdd_c: { warn: 50, days: 3 }   # a spinning disk whose coolest sample over the days stays at or above warn
  version_behind: { days: 30 }
  # a gateway, switch, access point, PDU, camera, or server first seen more than settle_hours after the first
  # node from the same source (the starting inventory is not news) is reported for show_days
  new_infrastructure: { settle_hours: 24, show_days: 7 }
  parity_slow: { floor_mb_s: 40, drop_vs_previous_pct: 50, max_age_days: 40, history: 5 }
  smart_trend: { window_days: 14 }   # the window for "rose by N" (reallocated, CRC, and so on)
  clock_skew: { max_minutes: 3 }
  storage_low: { min_free_pct: 15, min_days_until_full: 14 }

rules:
  smart_failing:
    kind: smart_failing
    bucket: act_now
    advice: >
      {disk} reports a failed SMART status. Back up anything not already protected, confirm
      parity is healthy, and replace the drive.

  smart_pending_nonzero:
    kind: smart_trend
    match:
      - { field: attr, op: in, value: ["197:Current_Pending_Sector", "198:Offline_Uncorrectable"] }
      - { field: raw, op: gt, value: 0 }
    bucket: act_now
    advice: >
      {disk} reports {raw} unreadable sectors. Confirm a current backup and that parity is
      healthy, then replace the drive. Do not wait for the count to grow.

  smart_realloc_rising:
    kind: smart_trend
    match:
      - { field: attr, op: eq, value: "5:Reallocated_Sector_Ct" }
      - { field: delta_14d, op: gt, value: 0 }
    bucket: plan
    advice: >
      {disk} remapped {delta_14d} sectors in 14 days. Plan a replacement within a few weeks
      and check again weekly.

  crc_rising:
    kind: crc_rising
    bucket: watch
    advice: >
      {disk} CRC errors rose by {delta_14d}. This usually points at the cable or backplane
      rather than the disk. Reseat or swap the cable and recheck.

  firmware_pending:
    kind: firmware_pending
    advice: >
      {name} ({model}) has a firmware update available (running {current_version}). Schedule the
      update for a maintenance window; read the release notes first for a gateway or a switch
      that other devices depend on.

  new_infrastructure:
    kind: new_infrastructure
    advice: >
      A new {device_kind} ({label}) appeared on the network map. Confirm it is yours and give it a
      label in topology.yaml.

  parity_slow:
    kind: parity_slow
    bucket: watch
    advice: >
      {server}'s parity check took {duration} at {speed} MB/s (previous: {previous_speed} MB/s).
      Check whether a tuning plugin paused it or heavy jobs overlapped it; if not, review each
      array disk's SMART data and the controller or cables.

  clock_skew:
    kind: clock_skew
    bucket: watch
    advice: >
      {system}'s clock is about {minutes} minutes off from the receiver. Point it at a working
      NTP server; time-based findings for this source are unreliable until it is fixed.

  storage_low:
    kind: storage_low
    bucket: plan
    advice: >
      {path} has {free_pct}% free, about {days} days at the current rate. Shorten the archive
      retention or free space before collection stops.

  traffic_spike_generic:
    kind: traffic_spike
    advice: >
      {device} moved {gb} GB today, about {multiple}x its normal. Check the top destinations.
      A game or OS update is a likely benign cause; if it repeats without a release, look for a
      background upload.

  new_device_generic:
    kind: new_device
    advice: >
      A new device ({label}) joined {vlan}. Confirm it is yours; if not, block it and review
      the network.

  odd_hours_device:
    kind: odd_hours
    advice: >
      {device} was online for {minutes} minutes during its quiet hours. Check whether that was
      expected (a schedule, a download, a guest); if not, look at what it connected to.
