# Live receiver: syslog over UDP and TCP -> sender gate -> raw archive + normalized events.
#
# This file is a template. At container start `python -m brief.vectorcfg` renders it into
# /run/vector/vector.yaml, filling the listen port and the sender allowlist from
# brief/network.yaml (and the SYSLOG_PORT environment variable). The defaults below are valid
# on their own, so `vector test` and `vector validate` can load the file unrendered.
# Field names and the parser are documented in docs/guide/02-baseline.md; the parser itself is
# parse.vrl, shared with the backfill import.
data_dir: /state/vector

sources:
  syslog_udp:
    type: socket
    mode: udp
    address: "0.0.0.0:514"        # rendered: ports.syslog
    host_key: source_ip           # the sender's IP becomes the host (matches systems.yaml)
  syslog_tcp:
    type: socket
    mode: tcp
    address: "0.0.0.0:514"        # rendered: ports.syslog
    host_key: source_ip

transforms:
  # Syslog over UDP can be spoofed by anything on the LAN, so senders outside the allowlist are
  # either flagged (kept, with unknown_sender: true) or dropped before anything is written.
  gate:
    type: remap
    inputs: [syslog_udp, syslog_tcp]
    source: |
      # BEGIN rendered:senders
      allowed_senders = []
      unknown_policy = "flag"
      # END rendered:senders
      if length(allowed_senders) > 0 {
        known, err = ip_cidr_contains(allowed_senders, string!(.source_ip))
        if err != null || !known {
          if unknown_policy == "drop" {
            abort
          }
          .unknown_sender = true
        }
      }

  parse:
    type: remap
    inputs: [gate]
    file: /app/vector/parse.vrl

sinks:
  # One raw file per sender per day, exactly as received (the source of truth for replays).
  # Days are UTC. The worker compresses finished days (`python -m brief.archive compress`).
  archive:
    type: file
    inputs: [gate]
    path: /archive/%Y-%m-%d/{{ source_ip }}.log
    encoding: { codec: text }

  events:
    type: file
    inputs: [parse]
    path: /state/events/%Y-%m-%d.ndjson
    encoding: { codec: json }
    idle_timeout_secs: 300
