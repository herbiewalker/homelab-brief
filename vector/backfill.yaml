# One-off backfill import (run by `brief import --from /import`), never part of the live config.
# Reads the old syslog-<ip>.log files read-only and runs the same parser as the live receiver.
# The sender comes from the file name. These files dropped the priority field, so severity is
# inferred from keywords (severity_inferred: true on every imported event).
data_dir: /state/vector-import

sources:
  old_files:
    type: file
    include: ["/import/syslog-*.log"]
    read_from: beginning
    ignore_checkpoints: true

transforms:
  host_from_file:
    type: remap
    inputs: [old_files]
    source: |
      parts = parse_regex!(string!(.file), r'syslog-(?P<ip>[0-9a-fA-F.:]+)\.log$')
      .source_ip = parts.ip
      .imported = true
      del(.file)
      del(.host)

  parse:
    type: remap
    inputs: [host_from_file]
    file: /app/vector/parse.vrl

sinks:
  archive:
    type: file
    inputs: [host_from_file]
    path: /archive/import/{{ source_ip }}.log
    buffer: { type: memory, max_events: 200 }
    encoding: { codec: text }

  events:
    type: file
    inputs: [parse]
    path: /state/events/import.ndjson.partial  # renamed to import.ndjson by `brief import` when complete
    buffer: { type: memory, max_events: 200 }
    encoding: { codec: json }
