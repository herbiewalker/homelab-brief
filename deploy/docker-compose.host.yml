# Reference deployment, mode 2 of 3: host networking (the container shares the Unraid host's address).
# Unraid itself listens on 80 and 443 and may run its own syslog server on 514, so move the container's
# ports first. Set them in config/brief/network.yaml (ports: syslog / http / https) or with the
# variables below; the Network page in the admin GUI suggests 5514 / 8480 / 8443.
# Devices then send syslog to <host-address>:<syslog port>. Host access to custom networks is not needed.
# The pool is Unraid's default, cache; change /mnt/cache if yours differs.
services:
  homelab-brief:
    image: ghcr.io/herbiewalker/homelab-brief:stable  # follows releases; use an exact version to stay put
    container_name: homelab-brief
    restart: unless-stopped
    network_mode: host
    env_file: /mnt/user/appdata/homelab-brief/homelab-brief.env   # mode 600
    environment:
      SYSLOG_PORT: "5514"
      HTTP_PORT: "8480"
      HTTPS_PORT: "8443"
    volumes:
      - /mnt/user/appdata/homelab-brief/config:/config
      - /mnt/cache/appdata/homelab-brief/state:/state
      - /mnt/cache/syslog-archive:/archive
      - /mnt/user/<share>/brief:/out
    labels:
      net.unraid.docker.webui: http://[IP]:8480/
      net.unraid.docker.managed: 'composeman'
      net.unraid.docker.icon: https://raw.githubusercontent.com/herbiewalker/homelab-brief/main/deploy/icon.png
    mem_limit: 768m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "2" } }
