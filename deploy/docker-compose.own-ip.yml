# Reference deployment, mode 1 of 3: one container with its own LAN IP on br0 (the default and recommended mode).
# Other modes: docker-compose.host.yml, docker-compose.bridge.yml.
# Network: br0 is the default (Unraid already provides it). To use a dedicated network such as syslog-net, define it as an external or macvlan/ipvlan network and rename it below.
# The Unraid template (deploy/unraid-template.xml) is the primary install path;
# this compose file mirrors it for Compose Manager users.
# Replace <pin> and <container-ip>. The pool is Unraid's default, cache; change /mnt/cache if yours is named differently. Secrets come from template variables or an
# env file in appdata (mode 600), never from a Filesystem MCP folder.
services:
  homelab-brief:
    image: ghcr.io/<owner>/homelab-brief:<pin>
    container_name: homelab-brief
    restart: unless-stopped
    networks:
      br0:
        ipv4_address: <container-ip>
    env_file: /mnt/user/appdata/homelab-brief/homelab-brief.env
    volumes:
      - /mnt/user/appdata/homelab-brief/config:/config
      - /mnt/cache/appdata/homelab-brief/state:/state
      - /mnt/cache/syslog-archive:/archive
      - /mnt/user/<share>/brief:/out
      # one-off backfill import (Task 7); remove after `brief import` completes
      - /mnt/user/<share>/syslog:/import:ro
    labels:
      net.unraid.docker.webui: https://[IP]:[PORT:443]/admin  # the Unraid UI opens the admin page
      net.unraid.docker.managed: 'composeman'
    mem_limit: 768m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "2" } }
    # Ports 514/udp, 514/tcp, 80, 443 (and 22 if SSH_ENABLED) are reachable on <container-ip>.

networks:
  br0:
    external: true
