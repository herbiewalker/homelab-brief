line-length = 110
target-version = "py313"
src = ["brief/src"]
extend-exclude = ["**/*.md"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Long literal strings (log lines, SQL, HTML) read better unwrapped in tests and the end-to-end scripts.
"**/tests/**" = ["E501"]
"scripts/e2e_*.py" = ["E501"]
"brief/src/brief/cli_tools.py" = ["E501"]  # one-line command output formats and help text
