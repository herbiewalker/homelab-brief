line-length = 110
target-version = "py313"
src = ["brief/src"]
extend-exclude = ["**/*.md"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Long literal strings (log lines, SQL, HTML) read better unwrapped in tests and the end-to-end scripts.
"**/tests/**" = ["E501", "F811"]  # F811: fixtures imported from another test module are redefined as arguments
"scripts/e2e_*.py" = ["E501"]
"brief/src/brief/cli_tools.py" = ["E501"]  # one-line command output formats and help text
"brief/src/brief/cli_ai.py" = ["E501"]  # the same, for `brief ai`
"brief/src/brief/aiconfig.py" = ["E501"]  # the locked-guardrail sentences the AI page shows
"brief/src/brief/supportbundle.py" = ["E501"]  # one-line summary text
"brief/src/brief/redact.py" = ["E501"]  # regexes and word lists
"brief/src/brief/privateconf.py" = ["E501"]  # one-line messages
"brief/src/brief/mapsvg.py" = ["E501"]  # SVG and draw.io markup strings
"brief/src/brief/mcpserver.py" = ["E501"]  # tool descriptions and schema literals
"brief/src/brief/agenttools.py" = ["E501"]  # tool descriptions and schema literals
"brief/src/brief/agentrun.py" = ["E501"]  # one-line log, tool, and prompt strings
"brief/src/brief/proposals.py" = ["E501"]  # one-line messages
"brief/src/brief/agenteval.py" = ["E501"]  # long messages and SQL
"brief/src/brief/yamlscalar.py" = ["E501"]  # long messages and docstrings
"brief/src/brief/agenttriggers.py" = ["E501"]  # long messages and docstrings
"brief/src/brief/agentnotes.py" = ["E501"]  # long messages and docstrings
"brief/src/brief/agentguards.py" = ["E501"]  # long messages and docstrings
"brief/src/brief/agentout.py" = ["E501"]  # long messages and docstrings
"brief/src/brief/mcptokens.py" = ["E501"]  # one-line messages
